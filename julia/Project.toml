# PauliPropagation.jl is an OPTIONAL accelerator for target generation and is
# deliberately not listed above: it is not in the General registry, so listing
# it here would make `Pkg.instantiate()` fail on a fresh machine. The code
# guards the import and falls back to julia/src/bppps_engine.jl.
# To enable the fast path:
#   julia --project=julia -e 'using Pkg; Pkg.add(url="https://github.com/MSRudolph/PauliPropagation.jl")'
#   julia --project=julia julia/scripts/check_env.jl

[compat]
julia = "1.10"
