# Variational ansatz and the two Trotter circuits it is compared against.
#
# The ansatz is a Hamiltonian Variational Ansatz (HVA), not a generic
# hardware-efficient ansatz: its generators are exactly the Hamiltonian terms,
# which is what makes the Pauli-propagation cost tractable. It is still
# SWAP-free on a 2D square lattice, so it maps onto IBM Nighthawk directly.
ansatz:
  type: "HamiltonianVariationalAnsatz"
  topology: "2D_Square_Lattice"
  n_layers: 3
  single_qubit_rotation: "RX"       # generator X_i  (transverse field term)
  entanglement_gate: "RZZ"          # generator Z_i Z_j (coupling term)
  substeps: 4                       # square-lattice edge colouring
  max_depth: 50                     # hardware budget (rx/rzz level)

# Precision target used to define L_{X,Z}. These are the BP-PPS paper values
# (Sec. III B): 4th-order Suzuki-Trotter, dt = 0.001, truncation 1e-8.
target:
  delta_t: 0.5
  dt: 0.001
  trotter_order: 4
  cutoff: 1.0e-8
  observables: "XZ"
  # Which propagation kernel generates the targets. This is the single most
  # expensive step in the project, and it ran on the string-dict oracle until
  # 2026-09-04.
  #   string  propagation.py, the oracle. Slowest; keep for cross-checks.
  #   sorted  propagation_sorted.py on numpy. Term-for-term identical output
  #           (verified at 2x2 and 3x3, max coefficient deviation exactly 0.0);
  #           8.4x at 500K terms, and a small loss below ~10K terms.
  #   gpu     the same code with xp=cupy. Above the crossover only -- cupy
  #           loses at 30K terms and wins 17.3x at 1.2M. Needs
  #           `source scripts/cuda12_env.sh` first on the desktop.
  # Caveat: the truncation *estimate* eps_trunc is not identical between
  # engines (the array engines take it as a norm difference per gate, the
  # string engine accumulates discarded terms). The SPOs are identical; the
  # estimate agrees to ~4 digits at 1e-5 and is unreliable for either engine
  # once the discarded norm approaches float64 cancellation against 1.0.
  engine: sorted

# Trotter circuits that could actually be run on hardware, used as the
# depth-compression baseline. The dt=0.001 target above is NOT a baseline.
hardware_trotter:
  order: 2
  dt_values: [0.1, 0.2]
  time_points: [0.1, 0.2, 0.3, 0.5, 1.0]
